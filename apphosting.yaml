runConfig:
  minInstances: 0
  maxInstances: 3
  concurrency: 80
  cpu: 1
  memoryMiB: 512

env:
  - variable: FIREBASE_PROJECT_ID
    value: law-clinic-finder
    availability:
      - RUNTIME
  - variable: FIREBASE_DATABASE_ID
    value: primary-eu
    availability:
      - RUNTIME
  - variable: FIREBASE_STORAGE_BUCKET
    value: law-clinic-finder.firebasestorage.app
    availability:
      - RUNTIME
  - variable: IDENTITY_PLATFORM_API_KEY
    secret: firebaseWebApiKey
  - variable: NEXT_PUBLIC_SITE_URL
    secret: siteUrl
  - variable: ANTHROPIC_API_KEY
    secret: anthropicApiKey
  - variable: SMTP_HOST
    value: smtp-relay.brevo.com
    availability:
      - RUNTIME
  - variable: SMTP_PORT
    value: '587'
    availability:
      - RUNTIME
  - variable: SMTP_LOGIN_EMAIL
    secret: smtpLoginEmail
  - variable: SMTP_PASSWORD
    secret: smtpPassword
  - variable: SMTP_FROM_EMAIL
    secret: smtpFromEmail
  - variable: SMTP_FROM_NAME
    value: Law Clinics Deutschland
    availability:
      - RUNTIME
  - variable: SMTP_SETTINGS_SECRET
    value: smtpSettings
    availability:
      - RUNTIME
  - variable: SMTP_SETTINGS_SECRET_LOCATION
    value: europe-west4
    availability:
      - RUNTIME

  # Chat text is de-identified by Cloud Sensitive Data Protection before it
  # reaches Anthropic or Firestore. There is no fallback redactor: if DLP cannot
  # inspect a message the chat returns 503. Verify with `npm run dlp:check`
  # after enabling the API and granting `law-clinic-runtime` the `dlp.user` role.
  - variable: REDACTION_PROVIDER
    value: dlp
    availability:
      - RUNTIME
  - variable: DLP_LOCATION
    value: europe-west4
    availability:
      - RUNTIME
  - variable: SITE_URL
    secret: siteUrl
  - variable: STAGING_ACCESS_ENABLED
    value: 'true'
    availability:
      - RUNTIME
  - variable: STAGING_ACCESS_USERNAME
    value: preview
    availability:
      - RUNTIME
  - variable: STAGING_ACCESS_PASSWORD
    secret: stagingAccessPassword
    availability:
      - RUNTIME
  # Google Analytics 4 (optional). Both plain values stay empty until the
  # operator fills them in — analytics and the dashboard's GA cards stay off
  # meanwhile. The measurement id is the public "G-" one and must reach the
  # build so it can be inlined into the client bundle; GA_PROPERTY_ID is the
  # numeric property id the Data API addresses.
  #
  # GA_SERVICE_ACCOUNT_JSON stays commented out on purpose: App Hosting fails a
  # rollout when a `secret:` reference cannot be resolved, and this secret does
  # not exist yet. Create `gaServiceAccountJson` in Secret Manager, grant
  # law-clinic-runtime `secretmanager.versions.access` on it alone, and only then
  # uncomment the two lines below. Until then the dashboard cards stay at "—".
  - variable: NEXT_PUBLIC_GA_MEASUREMENT_ID
    value: ''
    availability:
      - BUILD
      - RUNTIME
  - variable: GA_PROPERTY_ID
    value: ''
    availability:
      - RUNTIME
  # - variable: GA_SERVICE_ACCOUNT_JSON
  #   secret: gaServiceAccountJson
