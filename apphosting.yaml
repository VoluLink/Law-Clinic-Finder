runConfig:
  minInstances: 0
  maxInstances: 3
  concurrency: 80
  cpu: 1
  memoryMiB: 512

env:
  - variable: FIREBASE_PROJECT_ID
    value: law-clinic-finder
    availability:
      - RUNTIME
  - variable: FIREBASE_DATABASE_ID
    value: primary-eu
    availability:
      - RUNTIME
  - variable: FIREBASE_STORAGE_BUCKET
    value: law-clinic-finder.firebasestorage.app
    availability:
      - RUNTIME
  - variable: IDENTITY_PLATFORM_API_KEY
    secret: firebaseWebApiKey
  - variable: NEXT_PUBLIC_SITE_URL
    secret: siteUrl
  - variable: ANTHROPIC_API_KEY
    secret: anthropicApiKey
  - variable: SMTP_HOST
    value: smtp-relay.brevo.com
    availability:
      - RUNTIME
  - variable: SMTP_PORT
    value: '587'
    availability:
      - RUNTIME
  - variable: SMTP_LOGIN_EMAIL
    secret: smtpLoginEmail
  - variable: SMTP_PASSWORD
    secret: smtpPassword
  - variable: SMTP_FROM_EMAIL
    secret: smtpFromEmail
  - variable: SMTP_FROM_NAME
    value: Law Clinics Deutschland
    availability:
      - RUNTIME
  - variable: SMTP_SETTINGS_SECRET
    value: smtpSettings
    availability:
      - RUNTIME
  - variable: SMTP_SETTINGS_SECRET_LOCATION
    value: europe-west4
    availability:
      - RUNTIME

  # Chat text is de-identified by Cloud Sensitive Data Protection before it
  # reaches Anthropic or Firestore. There is no fallback redactor: if DLP cannot
  # inspect a message the chat returns 503. Verify with `npm run dlp:check`
  # after enabling the API and granting `law-clinic-runtime` the `dlp.user` role.
  - variable: REDACTION_PROVIDER
    value: dlp
    availability:
      - RUNTIME
  - variable: DLP_LOCATION
    value: europe-west4
    availability:
      - RUNTIME

  # The first message of a conversation must solve a challenge. `pow` is a
  # self-hosted proof of work: no third party, no cookie, nothing to provision
  # and no Datenschutzerklärung entry. Turnstile is implemented server-side but
  # has no browser widget yet, so selecting it here would leave the client with
  # no token and the server rejecting every opening message.
  - variable: CHALLENGE_ENABLED
    value: 'true'
    availability:
      - RUNTIME
  - variable: CHALLENGE_PROVIDER
    value: pow
    availability:
      - RUNTIME
  # The browser's copy is inlined at build time, so BUILD is required here. Drop
  # it and the client never solves anything while the server keeps demanding it.
  - variable: NEXT_PUBLIC_CHALLENGE_PROVIDER
    value: pow
    availability:
      - BUILD
      - RUNTIME
  - variable: SITE_URL
    secret: siteUrl
  - variable: STAGING_ACCESS_ENABLED
    value: 'true'
    availability:
      - RUNTIME
  - variable: STAGING_ACCESS_USERNAME
    value: preview
    availability:
      - RUNTIME
  - variable: STAGING_ACCESS_PASSWORD
    secret: stagingAccessPassword
    availability:
      - RUNTIME
  # Google Analytics 4, einwilligungsgesteuert: der Browser lädt gtag erst,
  # wenn das Banner zustimmt, und das Admin-Dashboard liest dieselbe Property
  # über die Data API mit dem `ga-reader`-Dienstkonto.
  #
  # Die Measurement-ID ist die öffentliche "G-"-ID und wird in das Browser-Bundle
  # eingebaut, braucht also BUILD. GA_PROPERTY_ID ist die numerische Property,
  # die die Data API adressiert — eine andere ID, nicht austauschbar.
  #
  # `value: ''` ist kein Weg, einen Eintrag leer zu lassen: der App-Hosting-
  # Preparer lehnt einen Eintrag ohne Wert und ohne Secret ab und der Rollout
  # bricht vor dem Build ab. Auskommentiert ist die einzige Schreibweise für
  # "nicht gesetzt", die er akzeptiert.
  - variable: NEXT_PUBLIC_GA_MEASUREMENT_ID
    value: G-PTQZ3TYZGP
    availability:
      - BUILD
      - RUNTIME
  - variable: GA_PROPERTY_ID
    value: '550071220'
    availability:
      - RUNTIME
  - variable: GA_SERVICE_ACCOUNT_JSON
    secret: gaServiceAccountJson
